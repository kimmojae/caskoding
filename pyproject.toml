[project]
name = "caskoding"
version = "0.1.0"
description = "CaskaydiaMono Nerd Font Mono with D2Coding Hangul, gaps filled from JuliaMono."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.60",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
